<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESLock Gallery Decrypter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            --bg-main: #11111b; --bg-card: #1e1e2e;
            --text-main: #cdd6f4; --text-muted: #a6adc8;
            --accent: #cba6f7; --accent-hover: #b4befe;
            --border-color: #313244;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0; padding: 2rem;
            box-sizing: border-box;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 { color: var(--accent); margin-bottom: 0.5rem; }
        p.subtitle { color: var(--text-muted); }

        .upload-controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .upload-btn {
            background-color: var(--bg-card);
            border: 2px dashed var(--text-muted);
            color: var(--text-main);
            padding: 1rem 2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 200px;
        }

        .upload-btn:hover {
            border-color: var(--accent);
            background-color: rgba(203, 166, 247, 0.1);
        }

        .upload-btn span { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; margin-top: 0.5rem; }
        input[type="file"] { display: none; }

        /* Estilos da Galeria */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .gallery-item:hover { transform: translateY(-5px); border-color: var(--accent); }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #000;
        }

        .gallery-item .info {
            padding: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-all;
            text-align: center;
        }

        .status { text-align: center; margin-bottom: 2rem; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <h1>ESLock Gallery</h1>
        <p class="subtitle">Visualize as suas imagens .eslock diretamente no browser.</p>
    </header>

    <div class="upload-controls">
        <label class="upload-btn">
            Carregar Pasta Inteira
            <span>Selecione uma pasta com os ficheiros</span>
            <input type="file" id="folderInput" webkitdirectory directory multiple />
        </label>

        <label class="upload-btn">
            Carregar Arquivo ZIP
            <span>Selecione um .zip com os ficheiros</span>
            <input type="file" id="zipInput" accept=".zip" />
        </label>
    </div>

    <div id="status" class="status"></div>

    <div class="gallery" id="gallery">
        </div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const zipInput = document.getElementById('zipInput');
        const gallery = document.getElementById('gallery');
        const statusDiv = document.getElementById('status');

        function updateStatus(msg) { statusDiv.textContent = msg; }

        // Adiciona uma imagem à galeria
        function addToGallery(blob, originalName) {
            const item = document.createElement('div');
            item.className = 'gallery-item';

            const img = document.createElement('img');
            img.src = URL.createObjectURL(blob);
            img.loading = "lazy"; // Otimiza o carregamento

            const info = document.createElement('div');
            info.className = 'info';
            info.textContent = originalName;

            item.appendChild(img);
            item.appendChild(info);
            gallery.appendChild(item);
        }

        // Função utilitária para desencriptar blocos
        function decryptBlock(encryptedBuffer, key, iv) {
            const encryptedWordArray = CryptoJS.lib.WordArray.create(encryptedBuffer);
            const decrypted = CryptoJS.AES.decrypt(
                { ciphertext: encryptedWordArray },
                key,
                { iv: iv, mode: CryptoJS.mode.CFB, padding: CryptoJS.pad.NoPadding }
            );
            
            const words = decrypted.words;
            const sigBytes = decrypted.sigBytes;
            const u8 = new Uint8Array(sigBytes);
            for (let i = 0; i < sigBytes; i++) {
                u8[i] = (words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
            }
            return u8;
        }

        // Motor de Desencriptação (Retorna um Blob)
        async function processEslockFile(arrayBuffer, fileName) {
            const totalSize = arrayBuffer.byteLength;
            const dv = new DataView(arrayBuffer);

            // IV Fixo e Chave dinâmica extraída do final
            const ivHex = "000102030405060708090a0b0c0d0e0f";
            const iv = CryptoJS.enc.Hex.parse(ivHex);
            
            const keyOffset = totalSize - 29;
            const keyBytes = new Uint8Array(arrayBuffer, keyOffset, 16);
            const keyHex = Array.from(keyBytes).map(b => b.toString(16).padStart(2, '0')).join('');
            const key = CryptoJS.enc.Hex.parse(keyHex);

            const int2 = dv.getInt32(totalSize - 4, false);
            const condByte = dv.getInt8(totalSize - int2);
            let condition1 = (condByte !== -1);
            let int3 = condition1 ? dv.getInt32(totalSize - int2 + 1, false) : -1;

            const outputChunks = [];

            if (condition1) {
                const headerEnc = arrayBuffer.slice(0, int3);
                outputChunks.push(decryptBlock(headerEnc, key, iv));

                const middleEnd = totalSize - int2 - int3;
                outputChunks.push(new Uint8Array(arrayBuffer, int3, middleEnd - int3));

                const footerEnc = arrayBuffer.slice(middleEnd, middleEnd + int3);
                outputChunks.push(decryptBlock(footerEnc, key, iv));
            } else {
                let offset = 0;
                const end = totalSize - int2;
                const chunkSize = 16384;
                while (offset < end) {
                    const currentSize = Math.min(chunkSize, end - offset);
                    const chunkEnc = arrayBuffer.slice(offset, offset + currentSize);
                    outputChunks.push(decryptBlock(chunkEnc, key, iv));
                    offset += currentSize;
                }
            }

            // Descobrir MIME type básico pelo nome para o Blob
            let cleanName = fileName.replace(/\.eslock$/i, '');
            let mimeType = "application/octet-stream";
            if (cleanName.match(/\.(jpg|jpeg)$/i)) mimeType = "image/jpeg";
            else if (cleanName.match(/\.png$/i)) mimeType = "image/png";
            else if (cleanName.match(/\.gif$/i)) mimeType = "image/gif";
            else if (cleanName.match(/\.webp$/i)) mimeType = "image/webp";

            return new Blob(outputChunks, { type: mimeType });
        }

        // --- LÓGICA DE PASTA ---
        folderInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.eslock'));
            if (files.length === 0) {
                updateStatus("Nenhum ficheiro .eslock encontrado na pasta.");
                return;
            }
            
            updateStatus(`A processar ${files.length} ficheiros da pasta...`);
            gallery.innerHTML = ''; // Limpa a galeria
            
            for (let i = 0; i < files.length; i++) {
                try {
                    const arrayBuffer = await files[i].arrayBuffer();
                    const blob = await processEslockFile(arrayBuffer, files[i].name);
                    addToGallery(blob, files[i].name.replace('.eslock', ''));
                    updateStatus(`A processar... (${i + 1}/${files.length})`);
                } catch (err) {
                    console.error("Erro no ficheiro", files[i].name, err);
                }
            }
            updateStatus("Processamento da pasta concluído!");
        });

        // --- LÓGICA DE ZIP ---
        zipInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            updateStatus("A ler o arquivo ZIP...");
            gallery.innerHTML = '';

            try {
                const zip = await JSZip.loadAsync(file);
                const eslockFiles = Object.values(zip.files).filter(f => !f.dir && f.name.toLowerCase().endsWith('.eslock'));
                
                if (eslockFiles.length === 0) {
                    updateStatus("Nenhum ficheiro .eslock encontrado no ZIP.");
                    return;
                }

                updateStatus(`Encontrados ${eslockFiles.length} ficheiros no ZIP. A desencriptar...`);

                let count = 0;
                for (const zipEntry of eslockFiles) {
                    try {
                        const arrayBuffer = await zipEntry.async("arraybuffer");
                        // Obter apenas o nome do ficheiro, ignorando a estrutura de pastas internas do ZIP
                        const fileName = zipEntry.name.split('/').pop(); 
                        const blob = await processEslockFile(arrayBuffer, fileName);
                        addToGallery(blob, fileName.replace('.eslock', ''));
                        count++;
                        updateStatus(`A processar... (${count}/${eslockFiles.length})`);
                    } catch (err) {
                        console.error("Erro a extrair do ZIP", zipEntry.name, err);
                    }
                }
                updateStatus("Extração do ZIP concluída!");
            } catch (error) {
                console.error(error);
                updateStatus("Erro ao ler o ficheiro ZIP.");
            }
        });
    </script>
</body>
</html>
