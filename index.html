<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESLock Decrypter - Automático</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-main: #11111b; --bg-card: #1e1e2e;
            --text-main: #cdd6f4; --text-muted: #a6adc8;
            --accent: #cba6f7; --accent-hover: #b4befe;
            --success: #a6e3a1; --error: #f38ba8; --warning: #f9e2af;
            --border-color: #313244;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0; display: flex; justify-content: center;
            align-items: center; min-height: 100vh;
            padding: 1rem; box-sizing: border-box;
        }

        .container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px; padding: 2.5rem;
            width: 100%; max-width: 550px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h2 { color: var(--accent); margin-top: 0; }
        p.subtitle { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 2rem; }

        .drop-zone {
            border: 2px dashed var(--text-muted); border-radius: 12px;
            padding: 3rem 2rem; cursor: pointer; transition: 0.3s;
            background-color: rgba(49, 50, 68, 0.3); margin-bottom: 1.5rem;
        }
        .drop-zone:hover { border-color: var(--accent); }
        .drop-zone p { margin: 0; font-weight: 500; pointer-events: none; }
        .drop-zone span { display: block; font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; pointer-events: none; }
        input[type="file"] { display: none; }

        button {
            background-color: var(--accent); color: var(--bg-main);
            border: none; padding: 14px 24px; border-radius: 8px;
            font-weight: 600; font-size: 1rem; width: 100%;
            cursor: pointer; transition: 0.2s;
        }
        button:hover:not(:disabled) { background-color: var(--accent-hover); }
        button:disabled { background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        .log-area {
            margin-top: 1.5rem; padding: 1rem;
            background-color: rgba(17, 17, 27, 0.5); border-radius: 8px;
            text-align: left; font-family: monospace; font-size: 0.85rem;
            height: 150px; overflow-y: auto; border: 1px solid var(--border-color);
        }
        .log-entry { margin-bottom: 0.4rem; }
        .log-info { color: var(--text-muted); }
        .log-success { color: var(--success); }
        .log-warning { color: var(--warning); }
        .log-error { color: var(--error); }
    </style>
</head>
<body>

    <div class="container">
        <h2>ESLock Decrypter</h2>
        <p class="subtitle">A desencriptar através da falha de extração da Chave. 100% Offline. Processe ficheiros usando apenas a memória do seu dispositivo.</p>
        
        <div class="drop-zone" id="dropZone">
            <p id="fileNameDisplay">Clique aqui para selecionar o ficheiro .eslock</p>
            <span>A chave será descoberta automaticamente</span>
        </div>
        <input type="file" id="fileInput" accept=".eslock" />
        
        <button id="decryptBtn" disabled>Desencriptar e Guardar</button>
        
        <div class="log-area" id="logArea">
            <div class="log-entry log-info">> A aguardar ficheiro...</div>
        </div>
    </div>

    <script>
        // Elementos UI
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const decryptBtn = document.getElementById('decryptBtn');
        const logArea = document.getElementById('logArea');
        let selectedFile = null;

        function log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `> ${msg}`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }
        function clearLogs() { logArea.innerHTML = ''; }

        // Utilitário: Desencriptar bloco isolado (pois o Java usa doFinal para tudo)
        function decryptBlock(encryptedBuffer, key, iv) {
            const encryptedWordArray = CryptoJS.lib.WordArray.create(encryptedBuffer);
            const decrypted = CryptoJS.AES.decrypt(
                { ciphertext: encryptedWordArray },
                key,
                { iv: iv, mode: CryptoJS.mode.CFB, padding: CryptoJS.pad.NoPadding }
            );
            
            // Converter de WordArray para Uint8Array
            const words = decrypted.words;
            const sigBytes = decrypted.sigBytes;
            const u8 = new Uint8Array(sigBytes);
            for (let i = 0; i < sigBytes; i++) {
                u8[i] = (words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
            }
            return u8;
        }

        // Eventos
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                decryptBtn.disabled = false;
                clearLogs();
                log(`Ficheiro carregado: ${selectedFile.name}`);
            }
        });

        // Motor Principal
        decryptBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            decryptBtn.disabled = true;
            clearLogs();
            log("A carregar ficheiro para a RAM...");

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const totalSize = arrayBuffer.byteLength;
                const dv = new DataView(arrayBuffer);

                // 1. Extração do IV (Fixo no APK: 0,1,2...15)
                const ivHex = "000102030405060708090a0b0c0d0e0f";
                const iv = CryptoJS.enc.Hex.parse(ivHex);

                // 2. Extração Dinâmica da Chave AES (Lê os 16 bytes do offset length - 29)
                const keyOffset = totalSize - 29;
                const keyBytes = new Uint8Array(arrayBuffer, keyOffset, 16);
                const keyHex = Array.from(keyBytes).map(b => b.toString(16).padStart(2, '0')).join('');
                const key = CryptoJS.enc.Hex.parse(keyHex);
                
                log(`Chave oculta encontrada: ${keyHex.substring(0, 8)}...`, "warning");

                // 3. Extrair dados estruturais do ficheiro
                const int2 = dv.getInt32(totalSize - 4, false); // Big Endian
                const condByte = dv.getInt8(totalSize - int2);
                let condition1 = (condByte !== -1);
                
                let int3 = -1;
                if (condition1) {
                    int3 = dv.getInt32(totalSize - int2 + 1, false);
                }

                log(`Estrutura: Condição=${condition1}, Blocos=${int3}`);

                const outputChunks = [];

                // 4. Lógica de Desencriptação com base no Tamanho
                if (condition1) {
                    // a) Desencriptar Cabeçalho
                    log("A desencriptar cabeçalho...");
                    const headerEnc = arrayBuffer.slice(0, int3);
                    outputChunks.push(decryptBlock(headerEnc, key, iv));

                    // b) Copiar o meio intacto
                    log("A extrair dados não encriptados...");
                    const middleEnd = totalSize - int2 - int3;
                    outputChunks.push(new Uint8Array(arrayBuffer, int3, middleEnd - int3));

                    // c) Desencriptar Rodapé
                    log("A desencriptar rodapé...");
                    const footerEnc = arrayBuffer.slice(middleEnd, middleEnd + int3);
                    outputChunks.push(decryptBlock(footerEnc, key, iv));

                } else {
                    // Ficheiros pequenos: desencriptar em pedaços de 16KB
                    log("A desencriptar ficheiro em blocos de 16KB...");
                    let offset = 0;
                    const end = totalSize - int2;
                    const chunkSize = 16384;

                    while (offset < end) {
                        const currentSize = Math.min(chunkSize, end - offset);
                        const chunkEnc = arrayBuffer.slice(offset, offset + currentSize);
                        outputChunks.push(decryptBlock(chunkEnc, key, iv));
                        offset += currentSize;
                    }
                }

                log("Reconstrução concluída. A preparar download...", "success");

                // 5. Download do ficheiro
                let originalName = selectedFile.name;
                if (originalName.toLowerCase().endsWith('.eslock')) {
                    originalName = originalName.slice(0, -7);
                } else {
                    originalName = "unlocked_" + originalName;
                }

                const blob = new Blob(outputChunks, { type: "application/octet-stream" });
                const downloadUrl = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.download = originalName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(downloadUrl), 5000);

                log("Sucesso! Ficheiro desencriptado.", "success");

            } catch (error) {
                console.error(error);
                log("Erro de processamento: O ficheiro pode não ser um eslock válido ou está corrompido.", "error");
            } finally {
                decryptBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
