<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESLock Cyber Gallery</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            /* Palette Cyberpunk Roxo/Azul */
            --bg-deep: #050509;
            --bg-card: #0c0c14;
            --bg-folder: #10101a;
            --text-main: #e0e0f0;
            --text-muted: #9090b0;
            --border: #1a1a2e;
            
            /* Gradiente Principal */
            --c-purple: #883aea;
            --c-blue: #1a73e8;
            --gradient: linear-gradient(135deg, var(--c-purple) 0%, var(--c-blue) 100%);
            --glow: 0 0 15px rgba(136, 58, 234, 0.4);
        }

        /* Animação Global de Entrada */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animação de Flutuação (CSS Base) */
        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0; padding: 2rem;
            box-sizing: border-box;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInUp 0.6s ease-out;
        }

        h1 {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
        }

        p.subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 0; }

        /* Controles de Upload Estilizados */
        .upload-controls {
            display: flex; gap: 1.5rem; justify-content: center;
            margin-bottom: 3rem; flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out;
        }

        .upload-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 1.2rem 2.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center;
            min-width: 220px;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de borda gradiente no hover */
        .upload-btn::after {
            content: ''; position: absolute; inset: 0;
            background: var(--gradient);
            opacity: 0; transition: opacity 0.3s;
            z-index: 0; border-radius: 12px;
        }

        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--glow);
            border-color: transparent;
        }

        .upload-btn:hover::after { opacity: 0.15; }

        .upload-btn * { z-index: 1; position: relative; }
        .upload-btn span { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; margin-top: 0.5rem; }
        input[type="file"] { display: none; }

        .status {
            text-align: center; margin-bottom: 2rem; font-weight: bold;
            background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: monospace;
        }

        /* Galeria Organizada */
        #galleryContainer { width: 100%; max-width: 1400px; margin: 0 auto; }

        .folder-section {
            background-color: var(--bg-folder);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.5s ease-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .folder-title {
            color: var(--text-main); font-size: 1.3rem; margin-top: 0; margin-bottom: 2rem;
            padding-bottom: 1rem; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 0.8rem;
        }
        
        .folder-title span { color: var(--c-purple); }

        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 2rem;
            /* Importante para não cortar a flutuação */
            padding: 10px 0; 
        }

        /* --- Estilo dos Ícones Flutuantes --- */
        .gallery-item {
            background-color: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            
            /* Ativação da animação base */
            animation-name: floating;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            /* Duração e delay definidos via JS para dessincronizar */
        }

        /* Efeitos ao passar o rato (Hover) */
        .gallery-item:hover {
            /* Para a animação de flutuar ao focar */
            animation-play-state: paused; 
            transform: scale(1.05) translateY(-5px) !important;
            box-shadow: 0 10px 30px rgba(136, 58, 234, 0.5);
            border-color: var(--c-purple);
            z-index: 10; /* Fica à frente dos outros */
        }

        .gallery-item img {
            width: 100%; height: 240px; object-fit: cover;
            background-color: #000;
            transition: transform 0.5s ease;
        }
        
        .gallery-item:hover img { transform: scale(1.03); }

        .gallery-item .info {
            padding: 1.2rem; text-align: center; display: flex; flex-direction: column; gap: 0.6rem;
            border-top: 1px solid var(--border);
            background-color: rgba(12, 12, 20, 0.8);
        }
        
        .gallery-item .filename {
            font-size: 0.9rem; color: var(--text-main); font-weight: bold;
            word-break: break-all;
        }

        .gallery-item .key-display {
            font-size: 0.75rem; color: var(--c-blue); font-family: 'Courier New', monospace;
            background-color: rgba(0, 0, 0, 0.3); padding: 0.5rem;
            border-radius: 6px; word-break: break-all;
            border: 1px solid rgba(26, 115, 232, 0.2);
        }

        /* Lightbox (Visualizador em Ecrã Cheio) */
        #lightbox {
            position: fixed; inset: 0; background-color: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
        }
        #lightbox.active { display: flex; opacity: 1; }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,0.8); transform: scale(0.9); transition: transform 0.3s ease; }
        #lightbox.active img { transform: scale(1); }
        #lightbox-caption { position: absolute; bottom: 20px; color: #fff; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>ESLock Cyber Gallery</h1>
        <p class="subtitle">Desencriptação Offline & Visualização Futurista</p>
    </header>

    <div class="upload-controls">
        <label class="upload-btn">
            Carregar Pasta
            <span>Processar subpastas recursivamente</span>
            <input type="file" id="folderInput" webkitdirectory directory multiple />
        </label>

        <label class="upload-btn">
            Carregar ZIP
            <span>Desencriptar arquivo compactado</span>
            <input type="file" id="zipInput" accept=".zip" />
        </label>
    </div>

    <div id="status" class="status"></div>

    <div id="galleryContainer"></div>

    <div id="lightbox">
        <img src="" alt="Média em ecrã cheio">
        <div id="lightbox-caption"></div>
    </div>

    <script>
        // --- Lógica de UI & Animação ---
        const galleryContainer = document.getElementById('galleryContainer');
        const statusDiv = document.getElementById('status');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        
        let folderGrids = new Map();

        function updateStatus(msg) { statusDiv.textContent = `> ${msg}`; }

        function clearGallery() {
            galleryContainer.innerHTML = '';
            folderGrids.clear();
        }

        // Lightbox funções
        function openLightbox(src, name) {
            lightboxImg.src = src;
            lightboxCaption.textContent = name;
            lightbox.classList.add('active');
        }
        lightbox.addEventListener('click', () => lightbox.classList.remove('active'));

        function getFolderGrid(folderPath) {
            if (folderGrids.has(folderPath)) return folderGrids.get(folderPath);

            const section = document.createElement('div');
            section.className = 'folder-section';

            const title = document.createElement('h3');
            title.className = 'folder-title';
            title.innerHTML = `<span>📁</span> ${folderPath}`;

            const grid = document.createElement('div');
            grid.className = 'gallery-grid';

            section.appendChild(title);
            section.appendChild(grid);
            galleryContainer.appendChild(section);

            folderGrids.set(folderPath, grid);
            return grid;
        }

        function addToGallery(blob, originalName, hexKey, folderPath) {
            const grid = getFolderGrid(folderPath);
            const blobUrl = URL.createObjectURL(blob);

            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            // --- Aplicação de Flutuação Aleatória (Dessincronizada) ---
            // Duração entre 3s e 6s
            const duration = (Math.random() * 3 + 3).toFixed(2) + 's'; 
            // Atraso negativo para começar a meio da animação
            const delay = (Math.random() * -5).toFixed(2) + 's'; 
            
            item.style.animationDuration = duration;
            item.style.animationDelay = delay;

            const img = document.createElement('img');
            img.src = blobUrl;
            img.loading = "lazy"; 
            img.addEventListener('click', () => openLightbox(blobUrl, originalName));

            const info = document.createElement('div');
            info.className = 'info';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'filename';
            nameDiv.textContent = originalName;

            const keyDiv = document.createElement('div');
            keyDiv.className = 'key-display';
            keyDiv.textContent = `${hexKey}`;

            info.appendChild(nameDiv);
            info.appendChild(keyDiv);
            item.appendChild(img);
            item.appendChild(info);
            
            grid.appendChild(item);
        }

        // --- Lógica de Criptografia Base (Mantida do Java) ---
        function decryptBlock(encryptedBuffer, key, iv) {
            const encryptedWordArray = CryptoJS.lib.WordArray.create(encryptedBuffer);
            const decrypted = CryptoJS.AES.decrypt(
                { ciphertext: encryptedWordArray },
                key,
                { iv: iv, mode: CryptoJS.mode.CFB, padding: CryptoJS.pad.NoPadding }
            );
            
            const words = decrypted.words;
            const sigBytes = decrypted.sigBytes;
            const u8 = new Uint8Array(sigBytes);
            for (let i = 0; i < sigBytes; i++) {
                u8[i] = (words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
            }
            return u8;
        }

        async function processEslockFile(arrayBuffer, fileName) {
            const totalSize = arrayBuffer.byteLength;
            if (totalSize < 29) throw new Error("Arquivo inválido");

            const dv = new DataView(arrayBuffer);
            const iv = CryptoJS.enc.Hex.parse("000102030405060708090a0b0c0d0e0f");
            
            const keyBytes = new Uint8Array(arrayBuffer, totalSize - 29, 16);
            const keyHex = Array.from(keyBytes).map(b => b.toString(16).padStart(2, '0')).join('');
            const key = CryptoJS.enc.Hex.parse(keyHex);

            const int2 = dv.getInt32(totalSize - 4, false);
            const condByte = dv.getInt8(totalSize - int2);
            let condition1 = (condByte !== -1);
            let int3 = condition1 ? dv.getInt32(totalSize - int2 + 1, false) : -1;

            const outputChunks = [];

            if (condition1) {
                outputChunks.push(decryptBlock(arrayBuffer.slice(0, int3), key, iv));
                outputChunks.push(new Uint8Array(arrayBuffer, int3, (totalSize - int2 - int3) - int3));
                outputChunks.push(decryptBlock(arrayBuffer.slice(totalSize - int2 - int3, totalSize - int2), key, iv));
            } else {
                let offset = 0; const end = totalSize - int2; const chunkSize = 16384;
                while (offset < end) {
                    const currentSize = Math.min(chunkSize, end - offset);
                    outputChunks.push(decryptBlock(arrayBuffer.slice(offset, offset + currentSize), key, iv));
                    offset += currentSize;
                }
            }

            let cleanName = fileName.replace(/\.eslock$/i, '');
            let mimeType = "image/jpeg"; // Padrão
            if (cleanName.match(/\.png$/i)) mimeType = "image/png";
            else if (cleanName.match(/\.gif$/i)) mimeType = "image/gif";
            else if (cleanName.match(/\.webp$/i)) mimeType = "image/webp";

            return { blob: new Blob(outputChunks, { type: mimeType }), extractedKey: keyHex };
        }

        function extractFolderPath(fullPath) {
            if (!fullPath || !fullPath.includes('/')) return "Raiz";
            return fullPath.substring(0, fullPath.lastIndexOf('/'));
        }

        // --- Eventos de Carregamento ---
        document.getElementById('folderInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.eslock'));
            if (files.length === 0) return updateStatus("Nenhum .eslock encontrado.");
            
            updateStatus(`A inicializar Cyber Cifra para ${files.length} ficheiros...`);
            clearGallery();
            
            for (let i = 0; i < files.length; i++) {
                try {
                    const file = files[i];
                    const result = await processEslockFile(await file.arrayBuffer(), file.name);
                    const folderPath = extractFolderPath(file.webkitRelativePath || file.name);
                    addToGallery(result.blob, file.name.replace('.eslock', ''), result.extractedKey, folderPath);
                } catch (err) { console.error(err); }
            }
            updateStatus("Injeção na galeria concluída.");
        });

        document.getElementById('zipInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            updateStatus("A descompilar fluxo ZIP...");
            clearGallery();

            try {
                const zip = await JSZip.loadAsync(file);
                const eslockFiles = Object.values(zip.files).filter(f => !f.dir && f.name.toLowerCase().endsWith('.eslock'));
                if (eslockFiles.length === 0) return updateStatus("Nenhum .eslock no ZIP.");

                updateStatus(`A desencriptar matriz de ${eslockFiles.length} ficheiros...`);
                for (const zipEntry of eslockFiles) {
                    try {
                        const result = await processEslockFile(await zipEntry.async("arraybuffer"), zipEntry.name.split('/').pop());
                        addToGallery(result.blob, zipEntry.name.split('/').pop().replace('.eslock', ''), result.extractedKey, extractFolderPath(zipEntry.name));
                    } catch (err) { console.error(err); }
                }
                updateStatus("Matriz ZIP processada.");
            } catch (error) { updateStatus("Erro no fluxo ZIP."); }
        });
    </script>
</body>
</html>
