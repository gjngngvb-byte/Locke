<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESLock Cyber Gallery OS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            --bg-deep: #050509; --bg-card: #0c0c14; --bg-folder: #10101a;
            --text-main: #e0e0f0; --text-muted: #9090b0; --border: #1a1a2e;
            --c-purple: #883aea; --c-blue: #1a73e8;
            --gradient: linear-gradient(135deg, var(--c-purple) 0%, var(--c-blue) 100%);
            --glow: 0 0 15px rgba(136, 58, 234, 0.4);
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep); color: var(--text-main);
            margin: 0; padding: 2rem; box-sizing: border-box; min-height: 100vh; overflow-x: hidden;
        }

        header { text-align: center; margin-bottom: 3rem; animation: fadeInUp 0.6s ease-out; }
        h1 {
            background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 2.5rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px; display: inline-block;
        }
        p.subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 0; }

        .upload-controls {
            display: flex; gap: 1.5rem; justify-content: center; margin-bottom: 3rem; flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out;
        }

        .upload-btn {
            background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
            padding: 1.2rem 2.5rem; border-radius: 12px; cursor: pointer; font-weight: 600;
            transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; min-width: 220px;
            position: relative; overflow: hidden;
        }
        .upload-btn::after {
            content: ''; position: absolute; inset: 0; background: var(--gradient);
            opacity: 0; transition: opacity 0.3s; z-index: 0; border-radius: 12px;
        }
        .upload-btn:hover { transform: translateY(-3px); box-shadow: var(--glow); border-color: transparent; }
        .upload-btn:hover::after { opacity: 0.15; }
        .upload-btn * { z-index: 1; position: relative; }
        .upload-btn span { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; margin-top: 0.5rem; }
        input[type="file"] { display: none; }

        .status { text-align: center; margin-bottom: 2rem; font-weight: bold; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: monospace; }

        #galleryContainer { width: 100%; max-width: 1400px; margin: 0 auto; }

        .folder-section {
            background-color: var(--bg-folder); border: 1px solid var(--border); border-radius: 16px;
            padding: 2rem; margin-bottom: 2.5rem; animation: fadeInUp 0.5s ease-out; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .folder-title {
            color: var(--text-main); font-size: 1.3rem; margin-top: 0; margin-bottom: 2rem;
            padding-bottom: 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.8rem;
        }
        .folder-title span { color: var(--c-purple); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 2rem; padding: 10px 0; }

        .gallery-item {
            background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            animation-name: floating; animation-iteration-count: infinite; animation-timing-function: ease-in-out;
        }
        .gallery-item:hover {
            animation-play-state: paused; transform: scale(1.05) translateY(-5px) !important;
            box-shadow: 0 10px 30px rgba(136, 58, 234, 0.5); border-color: var(--c-purple); z-index: 10;
        }

        /* Etiqueta de Numeração */
        .item-number {
            position: absolute; top: 10px; left: 10px; background: var(--gradient); color: white;
            font-size: 0.8rem; font-weight: bold; padding: 4px 10px; border-radius: 20px;
            z-index: 5; box-shadow: 0 2px 5px rgba(0,0,0,0.5); font-family: monospace;
        }

        /* Container multimédia baseado no tipo */
        .media-container { width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; background-color: #000; overflow: hidden; position: relative; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; cursor: pointer; }
        .gallery-item:hover .media-container img { transform: scale(1.05); }
        .media-container audio { width: 90%; z-index: 2; filter: invert(0.9) hue-rotate(180deg); }
        .media-container .doc-icon { font-size: 4rem; }
        .media-container .download-btn { position: absolute; bottom: 15px; background: var(--gradient); border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; z-index: 2; }

        .gallery-item .info {
            padding: 1rem; text-align: center; display: flex; flex-direction: column; gap: 0.6rem;
            border-top: 1px solid var(--border); background-color: rgba(12, 12, 20, 0.8); flex-grow: 1;
        }
        .gallery-item .filename { font-size: 0.85rem; color: var(--text-main); font-weight: bold; word-break: break-all; }
        .gallery-item .key-display { font-size: 0.7rem; color: var(--c-blue); font-family: 'Courier New', monospace; background-color: rgba(0, 0, 0, 0.3); padding: 0.4rem; border-radius: 6px; word-break: break-all; border: 1px solid rgba(26, 115, 232, 0.2); }

        /* Lightbox Atualizado com Botão X */
        #lightbox {
            position: fixed; inset: 0; background-color: rgba(0,0,0,0.95); display: none;
            justify-content: center; align-items: center; flex-direction: column;
            z-index: 1000; opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(10px);
        }
        #lightbox.active { display: flex; opacity: 1; }
        
        .lightbox-close {
            position: absolute; top: 20px; right: 30px; color: var(--text-main);
            font-size: 3rem; cursor: pointer; line-height: 1; transition: color 0.2s; z-index: 1001;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .lightbox-close:hover { color: var(--c-purple); text-shadow: var(--glow); }

        #lightbox-content-wrapper { max-width: 90%; max-height: 80vh; display: flex; justify-content: center; align-items: center; }
        #lightbox-content-wrapper img, #lightbox-content-wrapper video { max-width: 100%; max-height: 80vh; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        #lightbox-caption { margin-top: 20px; color: #fff; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>

    <header>
        <h1>Cyber Gallery OS</h1>
        <p class="subtitle">Desencriptação Universal & Visualização Multimédia</p>
    </header>

    <div class="upload-controls">
        <label class="upload-btn">
            Carregar Pasta
            <span>Processar subpastas recursivamente</span>
            <input type="file" id="folderInput" webkitdirectory directory multiple />
        </label>
        <label class="upload-btn">
            Carregar ZIP
            <span>Desencriptar arquivo compactado</span>
            <input type="file" id="zipInput" accept=".zip" />
        </label>
    </div>

    <div id="status" class="status"></div>
    <div id="galleryContainer"></div>

    <div id="lightbox">
        <span class="lightbox-close" id="closeLightbox">&times;</span>
        <div id="lightbox-content-wrapper"></div>
        <div id="lightbox-caption"></div>
    </div>

    <script>
        const galleryContainer = document.getElementById('galleryContainer');
        const statusDiv = document.getElementById('status');
        const lightbox = document.getElementById('lightbox');
        const lightboxContent = document.getElementById('lightbox-content-wrapper');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const closeLightboxBtn = document.getElementById('closeLightbox');
        
        let folderGrids = new Map();
        let globalItemCounter = 0; // Contador numérico

        function updateStatus(msg) { statusDiv.textContent = `> ${msg}`; }

        function clearGallery() {
            galleryContainer.innerHTML = '';
            folderGrids.clear();
            globalItemCounter = 0;
        }

        // --- Sistema de Lightbox ---
        function openLightbox(src, name, type) {
            lightboxContent.innerHTML = ''; // Limpa conteúdo anterior
            
            if (type === 'image') {
                const img = document.createElement('img');
                img.src = src;
                lightboxContent.appendChild(img);
            } else if (type === 'video') {
                const vid = document.createElement('video');
                vid.src = src;
                vid.controls = true;
                vid.autoplay = true;
                lightboxContent.appendChild(vid);
            }

            lightboxCaption.textContent = name;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxContent.innerHTML = ''; // Limpa para parar reprodução de vídeos
        }

        closeLightboxBtn.addEventListener('click', closeLightbox);
        // Fecha se clicar fora do conteúdo
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target === lightboxContent) closeLightbox();
        });

        // --- Categorização de Ficheiros ---
        function getFileTypeInfo(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext)) return { type: 'image', cat: 'Imagens', icon: '🖼️' };
            if (['mp4', 'webm', 'ogg', 'mov', 'mkv'].includes(ext)) return { type: 'video', cat: 'Vídeos', icon: '🎬' };
            if (['mp3', 'wav', 'm4a', 'aac', 'flac'].includes(ext)) return { type: 'audio', cat: 'Áudios', icon: '🎵' };
            if (['pdf', 'doc', 'docx', 'txt', 'xls', 'xlsx'].includes(ext)) return { type: 'doc', cat: 'Documentos', icon: '📄' };
            return { type: 'other', cat: 'Outros Ficheiros', icon: '📦' };
        }

        // --- Gestão do Grid por Pasta e Tipo ---
        function getFolderGrid(folderPath, category, icon) {
            const sectionKey = `${folderPath} | ${category}`;
            if (folderGrids.has(sectionKey)) return folderGrids.get(sectionKey);

            const section = document.createElement('div');
            section.className = 'folder-section';

            const title = document.createElement('h3');
            title.className = 'folder-title';
            // Título exibe Pasta e a Categoria (ex: MeusArquivos / Imagens)
            title.innerHTML = `<span>${icon}</span> ${folderPath === 'Raiz' ? '' : folderPath + ' / '} ${category}`;

            const grid = document.createElement('div');
            grid.className = 'gallery-grid';

            section.appendChild(title);
            section.appendChild(grid);
            galleryContainer.appendChild(section);

            folderGrids.set(sectionKey, grid);
            return grid;
        }

        // --- Renderização Dinâmica do Item ---
        function addToGallery(blob, originalName, hexKey, folderPath) {
            globalItemCounter++;
            const fileInfo = getFileTypeInfo(originalName);
            const grid = getFolderGrid(folderPath, fileInfo.cat, fileInfo.icon);
            const blobUrl = URL.createObjectURL(blob);

            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            // Flutuação
            item.style.animationDuration = (Math.random() * 3 + 3).toFixed(2) + 's'; 
            item.style.animationDelay = (Math.random() * -5).toFixed(2) + 's'; 

            // Número
            const numBadge = document.createElement('div');
            numBadge.className = 'item-number';
            numBadge.textContent = globalItemCounter.toString().padStart(3, '0');
            item.appendChild(numBadge);

            // Container Multimédia
            const mediaContainer = document.createElement('div');
            mediaContainer.className = 'media-container';

            if (fileInfo.type === 'image') {
                const img = document.createElement('img');
                img.src = blobUrl;
                img.loading = "lazy"; 
                img.addEventListener('click', () => openLightbox(blobUrl, originalName, 'image'));
                mediaContainer.appendChild(img);
            } 
            else if (fileInfo.type === 'video') {
                const vid = document.createElement('video');
                vid.src = blobUrl;
                vid.muted = true; // Para prevenir autoplay barulhento no grid
                vid.addEventListener('click', () => openLightbox(blobUrl, originalName, 'video'));
                mediaContainer.appendChild(vid);
            }
            else if (fileInfo.type === 'audio') {
                const aud = document.createElement('audio');
                aud.src = blobUrl;
                aud.controls = true;
                mediaContainer.appendChild(aud);
            }
            else {
                // Documentos e Outros (Download direto)
                const icon = document.createElement('div');
                icon.className = 'doc-icon';
                icon.textContent = fileInfo.icon;
                
                const btn = document.createElement('button');
                btn.className = 'download-btn';
                btn.textContent = 'Guardar Ficheiro';
                btn.addEventListener('click', () => {
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = originalName;
                    a.click();
                });
                
                mediaContainer.appendChild(icon);
                mediaContainer.appendChild(btn);
            }

            const info = document.createElement('div');
            info.className = 'info';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'filename';
            nameDiv.textContent = originalName;

            const keyDiv = document.createElement('div');
            keyDiv.className = 'key-display';
            keyDiv.textContent = `🔑 ${hexKey.substring(0, 16)}...`;

            info.appendChild(nameDiv);
            info.appendChild(keyDiv);
            item.appendChild(mediaContainer);
            item.appendChild(info);
            
            grid.appendChild(item);
        }

        // --- Criptografia e Processamento (Motor Central) ---
        function decryptBlock(encryptedBuffer, key, iv) {
            const encryptedWordArray = CryptoJS.lib.WordArray.create(encryptedBuffer);
            const decrypted = CryptoJS.AES.decrypt(
                { ciphertext: encryptedWordArray }, key, { iv: iv, mode: CryptoJS.mode.CFB, padding: CryptoJS.pad.NoPadding }
            );
            const words = decrypted.words; const sigBytes = decrypted.sigBytes;
            const u8 = new Uint8Array(sigBytes);
            for (let i = 0; i < sigBytes; i++) u8[i] = (words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
            return u8;
        }

        async function processEslockFile(arrayBuffer, fileName) {
            const totalSize = arrayBuffer.byteLength;
            if (totalSize < 29) throw new Error("Arquivo inválido");

            const dv = new DataView(arrayBuffer);
            const iv = CryptoJS.enc.Hex.parse("000102030405060708090a0b0c0d0e0f");
            
            const keyBytes = new Uint8Array(arrayBuffer, totalSize - 29, 16);
            const keyHex = Array.from(keyBytes).map(b => b.toString(16).padStart(2, '0')).join('');
            const key = CryptoJS.enc.Hex.parse(keyHex);

            const int2 = dv.getInt32(totalSize - 4, false);
            const condByte = dv.getInt8(totalSize - int2);
            let condition1 = (condByte !== -1);
            let int3 = condition1 ? dv.getInt32(totalSize - int2 + 1, false) : -1;

            const outputChunks = [];

            if (condition1) {
                outputChunks.push(decryptBlock(arrayBuffer.slice(0, int3), key, iv));
                outputChunks.push(new Uint8Array(arrayBuffer, int3, (totalSize - int2 - int3) - int3));
                outputChunks.push(decryptBlock(arrayBuffer.slice(totalSize - int2 - int3, totalSize - int2), key, iv));
            } else {
                let offset = 0; const end = totalSize - int2; const chunkSize = 16384;
                while (offset < end) {
                    const currentSize = Math.min(chunkSize, end - offset);
                    outputChunks.push(decryptBlock(arrayBuffer.slice(offset, offset + currentSize), key, iv));
                    offset += currentSize;
                }
            }

            let cleanName = fileName.replace(/\.eslock$/i, '');
            // Atribuição básica de MIME para o Blob funcionar nos leitores
            let mimeType = "application/octet-stream"; 
            if (cleanName.match(/\.(jpg|jpeg|png|gif|webp)$/i)) mimeType = "image/" + cleanName.split('.').pop();
            else if (cleanName.match(/\.(mp4|webm)$/i)) mimeType = "video/" + cleanName.split('.').pop();
            else if (cleanName.match(/\.(mp3|wav|ogg)$/i)) mimeType = "audio/" + cleanName.split('.').pop();
            else if (cleanName.match(/\.pdf$/i)) mimeType = "application/pdf";

            return { blob: new Blob(outputChunks, { type: mimeType }), extractedKey: keyHex };
        }

        function extractFolderPath(fullPath) {
            if (!fullPath || !fullPath.includes('/')) return "Raiz";
            return fullPath.substring(0, fullPath.lastIndexOf('/'));
        }

        // --- Listeners de Upload ---
        document.getElementById('folderInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.eslock'));
            if (files.length === 0) return updateStatus("Nenhum .eslock encontrado.");
            
            updateStatus(`A inicializar descriptografia de ${files.length} ficheiros...`);
            clearGallery();
            
            for (let i = 0; i < files.length; i++) {
                try {
                    const file = files[i];
                    const cleanName = file.name.replace('.eslock', '');
                    const result = await processEslockFile(await file.arrayBuffer(), cleanName);
                    const folderPath = extractFolderPath(file.webkitRelativePath || file.name);
                    addToGallery(result.blob, cleanName, result.extractedKey, folderPath);
                } catch (err) { console.error(err); }
            }
            updateStatus("Desencriptação e categorização concluídas.");
        });

        document.getElementById('zipInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            updateStatus("A ler o arquivo ZIP...");
            clearGallery();

            try {
                const zip = await JSZip.loadAsync(file);
                const eslockFiles = Object.values(zip.files).filter(f => !f.dir && f.name.toLowerCase().endsWith('.eslock'));
                if (eslockFiles.length === 0) return updateStatus("Nenhum .eslock no ZIP.");

                updateStatus(`A processar ${eslockFiles.length} ficheiros do ZIP...`);
                for (const zipEntry of eslockFiles) {
                    try {
                        const cleanName = zipEntry.name.split('/').pop().replace('.eslock', '');
                        const result = await processEslockFile(await zipEntry.async("arraybuffer"), cleanName);
                        addToGallery(result.blob, cleanName, result.extractedKey, extractFolderPath(zipEntry.name));
                    } catch (err) { console.error(err); }
                }
                updateStatus("Matriz ZIP processada com sucesso.");
            } catch (error) { updateStatus("Erro no fluxo ZIP."); }
        });
    </script>
</body>
</html>
